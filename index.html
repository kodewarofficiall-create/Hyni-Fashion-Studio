<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyni Fashion Studio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #681d2c;
        }

        .video-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #681d2c;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        @media (min-width: 761px) {
            #heroVideo {
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center;
            }
        }
    </style>
</head>

<body>

    <div class="video-container">
        <video id="heroVideo" autoplay playsinline preload="auto"></video>
    </div>

    <script>
        const video = document.getElementById("heroVideo");

        function changeVideo() {
            const videoFile = window.innerWidth >= 761
                ? "assets/grand-opening-desktop.mp4"
                : "assets/grand-opening-mobile.mp4";

            if (video.dataset.current !== videoFile) {
                video.dataset.current = videoFile;
                video.src = videoFile;
                video.load();
                video.play().catch(() => { });
            }
        }

        changeVideo();

        window.addEventListener("resize", changeVideo);

        // Enable audio after visitor interaction
        function enableAudio() {
            video.muted = false;
            video.volume = 1;
            video.play().catch(() => { });

            document.removeEventListener("click", enableAudio);
            document.removeEventListener("touchstart", enableAudio);
        }

        document.addEventListener("click", enableAudio);
        document.addEventListener("touchstart", enableAudio);
    </script>

</body>

</html>
